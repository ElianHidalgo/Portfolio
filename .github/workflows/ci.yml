name: CI

# Every push (any branch) and every pull request into main.
on:
  push:
  pull_request:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: ./mvnw -B test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:scripts
      - run: npx ng test --watch=false
      # No API runs in CI, so build client-only; prerendering is verified on Cloudflare Pages.
      - run: npm run build
        env:
          PRERENDER: 'false'
