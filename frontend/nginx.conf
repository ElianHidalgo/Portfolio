server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects keep the host port (e.g. :8080) intact.
    absolute_redirect off;

    # Default language is Spanish. Part 4 replaces this with browser-language detection.
    location = / {
        return 302 /es/;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Each locale is its own single-page app: unknown paths fall back to its index.html.
    location /es/ {
        try_files $uri $uri/ /es/index.html;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }
}
