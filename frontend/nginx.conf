server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects keep the host port (e.g. :8080) intact.
    absolute_redirect off;

    # Root page picks the visitor's language (see frontend/root/index.html).
    location = / {
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Prerendered pages are served as files; anything else falls back to the client-only shell
    # (index.csr.html), which shows the right state (e.g. "project not found") in the browser.
    # Client-only builds (PRERENDER=false) have no index.csr.html, so index.html is the last resort.
    location /es/ {
        try_files $uri $uri/index.html /es/index.csr.html /es/index.html;
    }

    location /en/ {
        try_files $uri $uri/index.html /en/index.csr.html /en/index.html;
    }
}
