<a class="skip-link" href="#content" i18n="@@skipToContent">Skip to content</a>

<header class="site-header">
  <nav class="site-header__inner" aria-label="Main" i18n-aria-label="@@mainNavLabel">
    <ul class="site-nav">
      <li><a href="#about" i18n="@@navAbout">About</a></li>
      <li><a href="#skills" i18n="@@navSkills">Skills</a></li>
    </ul>
    @if (isSpanish) {
      <a class="lang-switch" href="/en/" hreflang="en" lang="en">English</a>
    } @else {
      <a class="lang-switch" href="/es/" hreflang="es" lang="es">Español</a>
    }
  </nav>
</header>

<main id="content" class="page">
  @if (profile.hasValue()) {
    <app-hero-section [profile]="profile.value()" />
    <app-about-section [profile]="profile.value()" />
    <app-skills-section [profile]="profile.value()" />
  } @else if (profile.error()) {
    <div class="status" role="alert">
      <p i18n="@@loadError">The profile didn’t load. Try again in a few seconds.</p>
      <button class="button" type="button" (click)="profile.reload()" i18n="@@retry">Try again</button>
    </div>
  } @else {
    <p class="status" role="status" i18n="@@profileLoading">Loading profile…</p>
  }
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <p>© {{ year }}</p>
    <p>
      <ng-container i18n="@@builtWith">Built with Spring Boot and Angular.</ng-container>
      <a [href]="sourceUrl" target="_blank" rel="noopener" i18n="@@viewSource">View the source code</a>
    </p>
  </div>
</footer>
