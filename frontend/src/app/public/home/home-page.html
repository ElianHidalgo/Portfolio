<main id="content" class="page">
  @if (profile.hasValue()) {
    <app-hero-section [profile]="profile.value()" />
    <app-about-section [profile]="profile.value()" />
    <app-projects-section />
    <app-skills-section [profile]="profile.value()" />
  } @else if (profile.error()) {
    <div class="status" role="alert" data-state="error">
      <p i18n="@@loadError">The profile didn’t load. Try again in a few seconds.</p>
      <button class="button" type="button" (click)="profile.reload()" i18n="@@retry">Try again</button>
    </div>
  } @else {
    <p class="status" role="status" data-state="loading" i18n="@@profileLoading">Loading profile…</p>
  }
</main>
