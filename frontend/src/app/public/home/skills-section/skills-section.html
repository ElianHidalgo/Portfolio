@if (groups().length > 0) {
  <section id="skills" class="section" aria-labelledby="skills-title">
    <h2 id="skills-title" class="section__title" i18n="@@skillsTitle">Skills</h2>
    <div class="skills">
      @for (group of groups(); track group.category) {
        <div class="skills__group">
          <h3 class="skills__category">{{ group.label }}</h3>
          <ul class="skills__list" translate="no">
            @for (skill of group.skills; track skill.name) {
              <li>{{ skill.name }}</li>
            }
          </ul>
        </div>
      }
    </div>
  </section>
}
