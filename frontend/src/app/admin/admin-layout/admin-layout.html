<header class="admin-header">
  <div class="admin-header__inner">
    <nav class="admin-header__sections" aria-label="Secciones del panel">
      <a routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Inicio</a>
      <a routerLink="/admin/perfil" routerLinkActive="is-active" ariaCurrentWhenActive="page">Perfil</a>
      <a routerLink="/admin/mensajes" routerLinkActive="is-active" ariaCurrentWhenActive="page">Mensajes</a>
    </nav>
    <div class="admin-header__actions">
      <a href="/es/">Ver sitio</a>
      <button class="button" type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>
<main id="content" class="admin-main">
  <router-outlet />
</main>
