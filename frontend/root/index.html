<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portafolio | Portfolio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1612" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/es/favicon.svg">
  <link rel="alternate" hreflang="es" href="{{SITE_URL}}/es/">
  <link rel="alternate" hreflang="en" href="{{SITE_URL}}/en/">
  <link rel="alternate" hreflang="x-default" href="{{SITE_URL}}/es/">
  <script>
    // Sends visitors to their language; without JavaScript the links below remain.
    <!-- pick-locale -->
    location.replace('/' + pickLocale(navigator.languages || [navigator.language || '']) + '/');
  </script>
  <style>
    :root { color-scheme: light dark; --paper: #f4f6f3; --ink: #142019; --accent: #2f7a3b; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0f1612; --ink: #e6ece7; --accent: #7cc47f; } }
    body { margin: 0; min-height: 100svh; display: grid; place-content: center; gap: 1rem;
           font-family: system-ui, sans-serif; color: var(--ink); background: var(--paper); text-align: center; }
    a { color: var(--accent); font-size: 1.25rem; font-weight: 600; }
    nav { display: flex; gap: 2rem; justify-content: center; }
  </style>
</head>
<body>
  <nav aria-label="Language / Idioma">
    <a href="/es/" hreflang="es" lang="es">Español</a>
    <a href="/en/" hreflang="en" lang="en">English</a>
  </nav>
</body>
</html>
